# Phi+ (fork): checks that the open-source build still compiles.
name: Phi+ build

on:
  push:
    branches: [phi-plus]
  pull_request:
    branches: [phi-plus]
  workflow_dispatch:

jobs:
  build:
    # Phi 2.18 needs the Xcode 27 compiler: Xcode 26.6 (macos-26's newest)
    # times out type-checking one of its SwiftData predicates.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - name: Download Phi Framework
        run: ./scripts/download_phi_framework.sh --version 2.18.0
        env:
          # Authenticated API calls: anonymous ones share a small per-runner limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PhiBrowser-OpenSource
        run: |
          xcodebuild build \
            -project Phi.xcodeproj \
            -scheme PhiBrowser-OpenSource \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-OpenSource \
            CODE_SIGNING_ALLOWED=NO
